# ContentOS local development stack. Dedicated to ContentOS only; never point
# any service at a Konsepthane database. Host ports bind to 127.0.0.1 only.

name: contentos

# Container-internal URLs are constructed here on purpose: host-oriented URLs
# from .env (127.0.0.1 + host ports) must not leak into containers.
x-backend-environment: &backend-environment
  CONTENTOS_ENVIRONMENT: ${CONTENTOS_ENVIRONMENT:-local}
  CONTENTOS_SERVICE_NAME: ${CONTENTOS_SERVICE_NAME:-Konsepthane ContentOS}
  CONTENTOS_APPLICATION_VERSION: ${CONTENTOS_APPLICATION_VERSION:-0.1.0}
  CONTENTOS_LOG_LEVEL: ${CONTENTOS_LOG_LEVEL:-INFO}
  # Konsepthane Publishing API (empty = the transport refuses to construct;
  # values live in the gitignored .env, never here).
  CONTENTOS_PUBLISHING_API_URL: ${CONTENTOS_PUBLISHING_API_URL:-}
  CONTENTOS_PUBLISHING_API_KEY: ${CONTENTOS_PUBLISHING_API_KEY:-}
  CONTENTOS_API_DOCS_ENABLED: ${CONTENTOS_API_DOCS_ENABLED:-true}
  # OpenAI adapter (optional). Empty = not configured: AI commands refuse
  # with a clear 503 instead of the worker dropping the task silently.
  CONTENTOS_OPENAI_API_KEY: ${CONTENTOS_OPENAI_API_KEY:-}
  CONTENTOS_OPENAI_MODEL: ${CONTENTOS_OPENAI_MODEL:-}
  CONTENTOS_OPENAI_TIMEOUT_SECONDS: ${CONTENTOS_OPENAI_TIMEOUT_SECONDS:-60}
  CONTENTOS_OPENAI_IMAGE_MODEL: ${CONTENTOS_OPENAI_IMAGE_MODEL:-}
  CONTENTOS_OPENAI_IMAGE_TIMEOUT_SECONDS: ${CONTENTOS_OPENAI_IMAGE_TIMEOUT_SECONDS:-120}
  # Subcontractor AI gateway (ADR 0011): CONTENTOS_AI_PROVIDER=subcontractor
  # routes every AI job to the self-hosted gateway on the host machine.
  CONTENTOS_AI_PROVIDER: ${CONTENTOS_AI_PROVIDER:-openai}
  CONTENTOS_SUBCONTRACTOR_BASE_URL: ${CONTENTOS_SUBCONTRACTOR_BASE_URL:-}
  CONTENTOS_SUBCONTRACTOR_API_KEY: ${CONTENTOS_SUBCONTRACTOR_API_KEY:-}
  CONTENTOS_SUBCONTRACTOR_MODEL: ${CONTENTOS_SUBCONTRACTOR_MODEL:-chatgpt}
  CONTENTOS_SUBCONTRACTOR_IMAGE_MODEL: ${CONTENTOS_SUBCONTRACTOR_IMAGE_MODEL:-chatgpt}
  CONTENTOS_SUBCONTRACTOR_TIMEOUT_SECONDS: ${CONTENTOS_SUBCONTRACTOR_TIMEOUT_SECONDS:-420}
  CONTENTOS_SUBCONTRACTOR_ADMIN_TOKEN: ${CONTENTOS_SUBCONTRACTOR_ADMIN_TOKEN:-}
  # External intelligence providers (Entegrasyonlar): all optional; empty =
  # not configured. Secrets stay in .env; containers only receive them here.
  CONTENTOS_SEMRUSH_API_KEY: ${CONTENTOS_SEMRUSH_API_KEY:-}
  CONTENTOS_SEMRUSH_DATABASE: ${CONTENTOS_SEMRUSH_DATABASE:-tr}
  CONTENTOS_SEMRUSH_DAILY_BUDGET: ${CONTENTOS_SEMRUSH_DAILY_BUDGET:-200}
  CONTENTOS_SEMRUSH_CACHE_HOURS: ${CONTENTOS_SEMRUSH_CACHE_HOURS:-72}
  CONTENTOS_GOOGLE_SERVICE_ACCOUNT_JSON: ${CONTENTOS_GOOGLE_SERVICE_ACCOUNT_JSON:-}
  CONTENTOS_GSC_SITE_URL: ${CONTENTOS_GSC_SITE_URL:-}
  CONTENTOS_GSC_DAILY_BUDGET: ${CONTENTOS_GSC_DAILY_BUDGET:-500}
  CONTENTOS_GSC_CACHE_HOURS: ${CONTENTOS_GSC_CACHE_HOURS:-12}
  CONTENTOS_GA4_PROPERTY_ID: ${CONTENTOS_GA4_PROPERTY_ID:-}
  CONTENTOS_GA4_KEY_EVENTS: ${CONTENTOS_GA4_KEY_EVENTS:-}
  CONTENTOS_GA4_DAILY_BUDGET: ${CONTENTOS_GA4_DAILY_BUDGET:-500}
  CONTENTOS_GA4_CACHE_HOURS: ${CONTENTOS_GA4_CACHE_HOURS:-12}
  CONTENTOS_GOOGLE_TRENDS_API_KEY: ${CONTENTOS_GOOGLE_TRENDS_API_KEY:-}
  CONTENTOS_GOOGLE_TRENDS_API_URL: ${CONTENTOS_GOOGLE_TRENDS_API_URL:-}
  CONTENTOS_GOOGLE_TRENDS_DAILY_BUDGET: ${CONTENTOS_GOOGLE_TRENDS_DAILY_BUDGET:-200}
  CONTENTOS_GOOGLE_TRENDS_CACHE_HOURS: ${CONTENTOS_GOOGLE_TRENDS_CACHE_HOURS:-24}
  # Google Trends — BigQuery Public Dataset (same service-account key).
  CONTENTOS_GOOGLE_CLOUD_PROJECT_ID: ${CONTENTOS_GOOGLE_CLOUD_PROJECT_ID:-}
  CONTENTOS_GOOGLE_TRENDS_BIGQUERY_COUNTRY: ${CONTENTOS_GOOGLE_TRENDS_BIGQUERY_COUNTRY:-TR}
  CONTENTOS_GOOGLE_TRENDS_BIGQUERY_DAILY_BUDGET: ${CONTENTOS_GOOGLE_TRENDS_BIGQUERY_DAILY_BUDGET:-20}
  CONTENTOS_GOOGLE_TRENDS_BIGQUERY_CACHE_HOURS: ${CONTENTOS_GOOGLE_TRENDS_BIGQUERY_CACHE_HOURS:-24}
  CONTENTOS_GOOGLE_TRENDS_BIGQUERY_MAX_BYTES_BILLED: ${CONTENTOS_GOOGLE_TRENDS_BIGQUERY_MAX_BYTES_BILLED:-2000000000}
  CONTENTOS_GOOGLE_TRENDS_BIGQUERY_SYNC_HOUR_UTC: ${CONTENTOS_GOOGLE_TRENDS_BIGQUERY_SYNC_HOUR_UTC:-15}
  CONTENTOS_PINTEREST_ACCESS_TOKEN: ${CONTENTOS_PINTEREST_ACCESS_TOKEN:-}
  CONTENTOS_PINTEREST_REGION: ${CONTENTOS_PINTEREST_REGION:-TR}
  CONTENTOS_PINTEREST_DAILY_BUDGET: ${CONTENTOS_PINTEREST_DAILY_BUDGET:-200}
  CONTENTOS_PINTEREST_CACHE_HOURS: ${CONTENTOS_PINTEREST_CACHE_HOURS:-24}
  CONTENTOS_INTEGRATIONS_HTTP_TIMEOUT_SECONDS: ${CONTENTOS_INTEGRATIONS_HTTP_TIMEOUT_SECONDS:-20}
  CONTENTOS_DATABASE_URL: postgresql+psycopg://${CONTENTOS_POSTGRES_USER:-contentos}:${CONTENTOS_POSTGRES_PASSWORD:-contentos-dev-password}@postgres:5432/${CONTENTOS_POSTGRES_DB:-contentos}
  CONTENTOS_DB_POOL_SIZE: ${CONTENTOS_DB_POOL_SIZE:-5}
  CONTENTOS_DB_POOL_TIMEOUT_SECONDS: ${CONTENTOS_DB_POOL_TIMEOUT_SECONDS:-30}
  CONTENTOS_DB_CONNECT_TIMEOUT_SECONDS: ${CONTENTOS_DB_CONNECT_TIMEOUT_SECONDS:-10}
  CONTENTOS_REDIS_BROKER_URL: redis://redis:6379/0
  CONTENTOS_REDIS_RESULT_URL: redis://redis:6379/1
  CONTENTOS_CELERY_DEFAULT_QUEUE: ${CONTENTOS_CELERY_DEFAULT_QUEUE:-contentos.default}
  CONTENTOS_CELERY_TASK_ALWAYS_EAGER: "false"
  CONTENTOS_CELERY_BROKER_CONNECTION_RETRY_ON_STARTUP: ${CONTENTOS_CELERY_BROKER_CONNECTION_RETRY_ON_STARTUP:-true}
  CONTENTOS_CELERY_BROKER_CONNECTION_TIMEOUT_SECONDS: ${CONTENTOS_CELERY_BROKER_CONNECTION_TIMEOUT_SECONDS:-10}
  CONTENTOS_CELERY_RESULT_EXPIRES_SECONDS: ${CONTENTOS_CELERY_RESULT_EXPIRES_SECONDS:-3600}

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${CONTENTOS_POSTGRES_USER:-contentos}
      POSTGRES_PASSWORD: ${CONTENTOS_POSTGRES_PASSWORD:-contentos-dev-password}
      POSTGRES_DB: ${CONTENTOS_POSTGRES_DB:-contentos}
    volumes:
      - contentos-postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${CONTENTOS_POSTGRES_HOST_PORT:-55432}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${CONTENTOS_POSTGRES_USER:-contentos} -d ${CONTENTOS_POSTGRES_DB:-contentos}",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [contentos]

  redis:
    image: redis:7-alpine
    # No named volume on purpose: Redis carries only transient broker messages
    # and short-expiry results, never durable workflow state.
    ports:
      - "127.0.0.1:${CONTENTOS_REDIS_HOST_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [contentos]

  migrate:
    build: apps/backend
    image: contentos-backend:dev
    command: ["alembic", "upgrade", "head"]
    environment: *backend-environment
    depends_on:
      postgres:
        condition: service_healthy
    networks: [contentos]

  api:
    image: contentos-backend:dev
    command:
      [
        "uvicorn",
        "contentos.api.app:create_app",
        "--factory",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
      ]
    environment: *backend-environment
    volumes:
      # Local secret files (gitignored): e.g. the Google service-account
      # key referenced by CONTENTOS_GOOGLE_SERVICE_ACCOUNT_JSON as
      # /run/contentos/secrets/<file>. Read-only inside the containers.
      - ./secrets:/run/contentos/secrets:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${CONTENTOS_API_HOST_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Liveness on purpose: container health tracks the API process itself,
      # while dependency readiness stays observable via /health/ready.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [contentos]

  worker:
    image: contentos-backend:dev
    command:
      [
        "python",
        "-m",
        "contentos.worker.main",
        "worker",
        "--loglevel=INFO",
        "-Q",
        "${CONTENTOS_CELERY_DEFAULT_QUEUE:-contentos.default}",
      ]
    environment: *backend-environment
    volumes:
      # Local secret files (gitignored): e.g. the Google service-account
      # key referenced by CONTENTOS_GOOGLE_SERVICE_ACCOUNT_JSON as
      # /run/contentos/secrets/<file>. Read-only inside the containers.
      - ./secrets:/run/contentos/secrets:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    stop_grace_period: 30s
    networks: [contentos]

  beat:
    image: contentos-backend:dev
    # Celery beat for the performance loop (daily provider syncs, assess,
    # refresh detection, history, suggestions). Exactly ONE instance.
    command:
      [
        "python",
        "-m",
        "contentos.worker.main",
        "beat",
        "--loglevel=INFO",
        "--schedule",
        "/tmp/celerybeat-schedule",
      ]
    environment: *backend-environment
    volumes:
      # Local secret files (gitignored): e.g. the Google service-account
      # key referenced by CONTENTOS_GOOGLE_SERVICE_ACCOUNT_JSON as
      # /run/contentos/secrets/<file>. Read-only inside the containers.
      - ./secrets:/run/contentos/secrets:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    stop_grace_period: 15s
    networks: [contentos]

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    image: contentos-admin:dev
    environment:
      NODE_ENV: production
      # Container-internal URL on purpose (service DNS, not 127.0.0.1); the
      # browser never receives this value - it stays server-side in Next.js.
      CONTENTOS_INTERNAL_API_URL: http://api:8000
    ports:
      - "127.0.0.1:${CONTENTOS_ADMIN_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # /api/health reflects the Next.js process only; no curl in the image,
      # so use Node's built-in fetch.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [contentos]

networks:
  contentos: {}

volumes:
  contentos-postgres-data: {}

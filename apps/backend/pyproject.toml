[project]
name = "contentos"
version = "0.1.0"
description = "Internal editorial operating system backend for Konsepthane."
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic",
  "celery[redis]",
  "fastapi",
  "pgvector",
  "psycopg[binary,pool]",
  "pydantic-settings",
  "redis",
  "sqlalchemy",
  "structlog",
  "uvicorn[standard]",
]

[dependency-groups]
dev = [
  "httpx",
  "mypy",
  "pytest",
  "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/contentos"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["celery"]
ignore_missing_imports = true

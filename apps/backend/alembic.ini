# ContentOS Alembic configuration.
#
# The database URL is intentionally NOT configured here. migrations/env.py
# resolves it from the typed ContentOS settings (CONTENTOS_DATABASE_URL),
# so no credentials may ever be hardcoded or committed in this file.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/src
path_separator = os
